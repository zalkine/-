<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>היער של גוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: the forest picture fills the top, a parchment answer board on wooden planks sits below it (beside it on short landscape phones). One look, no dark theme. */
:root {
  --plank: #6b4423;
  --plank-dark: #4a2c15;
  --parchment: #f1e0bd;
  --parchment-edge: #c9a874;
  --key: #e3b06f;
  --key-dark: #8a5a2e;
  --ink: #3a2412;
  --leaf: #2f7a43;
  --good: #2e9b4f;
  --bad: #c0392b;
  --sun: #ffd447;
  --font: "Rubik", "Arial Hebrew", "Arial", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #20301b;
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sceneWrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#menuFab {
  position: absolute; top: 8px; left: 8px;
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid #2a170a; background: #5a3a20; color: #f6ead2;
  font-size: 22px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
}
#scene { width: 100%; height: 100%; display: block; }

/* wooden planks under the parchment, like the picture */
#panel {
  background:
    repeating-linear-gradient(180deg, transparent 0 46px, rgba(0,0,0,0.35) 46px 49px),
    linear-gradient(90deg, #5c3a1d, #7a4e2a 30%, #6b4423 60%, #5a381b);
  padding: 12px 16px;
  display: flex;
  justify-content: center;
  border-top: 4px solid var(--plank-dark);
}
.board {
  position: relative;
  width: 100%;
  max-width: 820px;
  background: radial-gradient(ellipse at center, #f6e8c8 0%, var(--parchment) 55%, #dcc08c 100%);
  border: 3px solid var(--parchment-edge);
  border-radius: 10px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 0 30px rgba(140,100,50,0.25);
  padding: 10px 16px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.board::before, .board::after {
  content: "";
  position: absolute;
  top: 8px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #9a9a9a, #4b4b4b);
}
.board::before { left: 8px; }
.board::after { right: 8px; }
#obstacleName { font-size: 18px; font-weight: 500; color: var(--ink); min-height: 1.2em; text-align: center; }
#task {
  display: flex;
  align-items: center;
  gap: 14px;
  font-weight: 800;
  font-size: clamp(32px, 6vw, 46px);
  direction: ltr;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
#answer {
  min-width: 2.8em;
  height: 1.35em;
  border: 3px solid var(--leaf);
  border-radius: 10px;
  background: rgba(255,255,255,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--leaf);
}
#answer.blink:empty::after { content: "|"; font-weight: 500; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#msg { min-height: 1.3em; font-size: 18px; font-weight: 700; text-align: center; }
#msg.good { color: var(--good); }
#msg.bad { color: var(--bad); }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

#pad {
  display: grid;
  grid-template-columns: repeat(6, minmax(44px, 74px));
  gap: 10px;
  direction: ltr;
}
#pad button {
  font-family: var(--font);
  font-weight: 800;
  font-size: 26px;
  height: 52px;
  border: 2px solid var(--key-dark);
  border-radius: 12px;
  background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52);
  color: var(--ink);
  box-shadow: 0 4px 0 #5e3b1b, inset 0 2px 0 rgba(255,255,255,0.45);
  cursor: pointer;
  touch-action: manipulation;
}
#pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e3b1b; }
#pad button:focus-visible, .bigbtn:focus-visible, .levels button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#pad .ok { background: linear-gradient(180deg, #4fbf63, #2e9b4f 55%, #23803a); color: #fff; border-color: #1a5e2a; box-shadow: 0 4px 0 #154a22, inset 0 2px 0 rgba(255,255,255,0.35); }
#pad .del { background: linear-gradient(180deg, #faf1e2, #eadbc2); }

@media (orientation: landscape) and (max-height: 560px) {
  #app { flex-direction: row; }
  #panel { border-top: 0; border-left: 4px solid var(--plank-dark); width: 290px; align-items: center; padding: 8px; }
  .board { padding: 8px 10px; gap: 6px; }
  #pad { grid-template-columns: repeat(4, 54px); gap: 6px; }
  #pad button { height: 42px; font-size: 21px; }
  #task { font-size: 30px; }
}
@media (max-width: 480px) {
  #pad { grid-template-columns: repeat(4, 1fr); width: 100%; }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 30, 14, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
.overlay .board { max-width: 460px; padding: 26px 22px; gap: 14px; text-align: center; max-height: 100%; overflow-y: auto; }
.overlay h2 { font-size: 34px; font-weight: 800; margin: 0; color: var(--plank-dark); text-wrap: balance; }
.overlay p { margin: 0; font-size: 17px; line-height: 1.5; }
.credit { color: #b03a5b; font-size: 15px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.levels button, .bigbtn {
  font-family: var(--font);
  font-size: 16px;
  border: 2px solid var(--key-dark);
  border-radius: 12px;
  padding: 10px 8px;
  cursor: pointer;
  background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52);
  color: var(--ink);
  box-shadow: 0 4px 0 #5e3b1b;
  line-height: 1.3;
}
.levels button b { display: block; font-size: 22px; font-weight: 800; }
.levels button[aria-pressed="true"] { background: linear-gradient(180deg, #ffe58a, var(--sun)); border-color: #a57b00; }
.bigbtn { width: 100%; font-size: 24px; font-weight: 800; background: linear-gradient(180deg, #4fbf63, #2e9b4f 55%, #23803a); color: #fff; border-color: #1a5e2a; box-shadow: 0 4px 0 #154a22; }
.bigbtn.plain { background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52); color: var(--ink); border-color: var(--key-dark); box-shadow: 0 4px 0 #5e3b1b; font-size: 18px; }
.stars { font-size: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; direction: ltr; }
label.namefield { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 17px; flex-wrap: wrap; }
label.namefield input {
  font: inherit; font-size: 18px; border: 2px solid var(--parchment-edge); border-radius: 10px; padding: 6px 10px; width: 9em; background: #fffaf0; color: var(--ink);
}
[hidden] { display: none !important; }

/* character designer */
.heroCard { display: flex; align-items: center; justify-content: center; gap: 14px; }
.heroCard svg { width: 76px; height: 106px; }
.heroCard .bigbtn { width: auto; font-size: 18px; padding: 10px 16px; }
#designOverlay .board { max-width: 720px; }
.designer { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; width: 100%; text-align: start; }
.designer .stage {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: radial-gradient(ellipse at 50% 85%, #b9d98c 0 30%, transparent 31%), linear-gradient(180deg, #cfe9f2, #e9f3d8);
  border: 2px solid var(--parchment-edge); border-radius: 12px; padding: 12px 8px;
}
.designer .stage svg { width: 190px; height: 266px; }
.designer .opts { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.optrow { display: flex; flex-direction: column; gap: 6px; }
.optrow .lbl { font-weight: 700; font-size: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  border: 3px solid #fffaf0; box-shadow: 0 0 0 2px var(--key-dark);
  padding: 0;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--leaf), 0 0 0 6px var(--sun); }
.swatch.orig { background-image: linear-gradient(135deg, transparent 0 46%, #fffaf0 46% 54%, transparent 54%); }
.chipbtn {
  font-family: var(--font); font-size: 22px; min-width: 48px; height: 44px; padding: 0 10px;
  border-radius: 12px; border: 2px solid var(--key-dark); cursor: pointer;
  background: linear-gradient(180deg, #faf1e2, #eadbc2); color: var(--ink);
}
.chipbtn.txt { font-size: 16px; font-weight: 700; }
.chipbtn[aria-pressed="true"] { background: linear-gradient(180deg, #ffe58a, var(--sun)); border-color: #a57b00; }
.swatch:focus-visible, .chipbtn:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
.designActions { display: flex; gap: 10px; width: 100%; }
.designActions .bigbtn { flex: 1; }
@media (max-width: 600px) {
  .designer { grid-template-columns: 1fr; }
  .designer .stage { flex-direction: row; justify-content: center; }
  .designer .stage svg { width: 110px; height: 154px; }
  .designer .stage .namefield { flex-direction: column; }
  .designer .stage .namefield input { width: 7em; }
  .swatch { width: 32px; height: 32px; }
  .swatches { gap: 6px; }
  .chipbtn { min-width: 42px; height: 40px; font-size: 20px; }
}

.hit { cursor: pointer; }
.hit:focus-visible { outline: none; }
.hit:focus-visible circle { stroke: var(--sun); stroke-width: 4; }
.signGlow { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: 0.45; } }
.confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .signGlow { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="sceneWrap">
    <svg id="scene" viewBox="0 0 1536 700" preserveAspectRatio="xMidYMid meet" aria-label="היער של גוני"></svg>
    <button id="menuFab" aria-label="תפריט" hidden>☰</button>
  </div>
  <div id="panel">
    <div class="board">
      <div id="obstacleName"></div>
      <div id="task"><span id="question"></span><span>=</span><span id="answer" class="blink"></span></div>
      <div id="msg"></div>
      <div id="pad"></div>
    </div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="board">
    <h2>המסע ביער</h2>
    <p>פותרים תרגיל, והדמות עוברת מכשול!<br>4 מכשולים בכל קומה, מטפסים בסולם, ובסוף מחכה אוצר.</p>
    <p class="credit">משחק שהמציאה גוני 💚</p>
    <div class="heroCard">
      <svg id="miniHero" viewBox="-48 -150 100 155" aria-hidden="true"></svg>
      <button class="bigbtn plain" id="designBtn">🎨 עיצוב הדמות</button>
    </div>
    <div class="levels" id="levels">
      <button data-level="easy" aria-pressed="true"><b>קל</b>חיבור וחיסור עד 20</button>
      <button data-level="medium" aria-pressed="false"><b>בינוני</b>חיבור וחיסור עד 100</button>
      <button data-level="times" aria-pressed="false"><b>כפל</b>לוח הכפל</button>
      <button data-level="mix" aria-pressed="false"><b>אלוף</b>הכול ביחד, גם חילוק</button>
    </div>
    <button class="bigbtn" id="startBtn">יוצאים לדרך!</button>
  </div>
</div>

<div class="overlay" id="designOverlay" hidden>
  <div class="board">
    <h2>עיצוב הדמות</h2>
    <div class="designer">
      <div class="stage">
        <svg id="bigHero" viewBox="-48 -150 100 155" aria-label="הדמות שלך"></svg>
        <label class="namefield" for="heroName">שם:
          <input id="heroName" maxlength="12" value="גוני">
        </label>
      </div>
      <div class="opts" id="designOpts"></div>
    </div>
    <div class="designActions">
      <button class="bigbtn plain" id="randomBtn">🎲 הפתעה</button>
      <button class="bigbtn" id="designDone">מוכן!</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay" hidden>
  <div class="board">
    <h2>האוצר נמצא! 🎉</h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <button class="bigbtn" id="nextBtn">ליער הבא</button>
    <button class="bigbtn plain" id="toMenuBtn">שינוי רמה</button>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("scene");
  const LADDER_X = 1357;
  const HERO_W = 72, HERO_H = 105;

  // Everything below is measured on the forest picture (1536 × 700).
  // Floors from bottom to top: the feet line, where the hero starts, the 4 obstacles
  // (jump from → to, how high), and the sign that hangs above each one.
  const FLOORS = [
    { y: 652, start: 250, steps: [
      { from: 300,  to: [605, 652],  peak: 70,  name: "מדלגים מעל שלולית בוץ" },
      { from: 605,  to: [852, 652],  peak: 150, name: "קופצים מעל שיח פירות יער" },
      { from: 852,  to: [1100, 652], peak: 125, name: "קפיצה מעל ערימת בולי עץ" },
      { from: 1100, to: [1335, 652], peak: 115, name: "קופצים מעל פטרייה ענקית" },
    ], signs: [[245, 462, 475, 512], [545, 462, 745, 512], [828, 463, 1030, 512], [1088, 463, 1300, 512]] },
    { y: 425, start: 245, steps: [
      { from: 285, to: [532, 425],  peak: 100, name: "קופצים מעל גזע חלול" },
      { from: 532, to: [737, 425],  peak: 85,  name: "קופצים מעל מלכודת קוצים" },
      { from: 737, to: [952, 425],  peak: 115, name: "קפיצה מעל בולי עץ גבוהים" },
      { from: 952, to: [1205, 425], peak: 85,  name: "עוד מלכודת קוצים!" },
    ], signs: [[285, 284, 490, 332], [535, 284, 745, 332], [815, 284, 1020, 332], [1076, 284, 1278, 332]] },
    { y: 243, start: 250, steps: [
      { from: 300,  to: [615, 243],  peak: 120, name: "קופצים מעל שיח פירות יער" },
      { from: 615,  to: [717, 204],  peak: 75,  name: "קופצים על הפטרייה" },
      { from: 717,  to: [1075, 243], peak: 60,  name: "קופצים מעל בול עץ" },
      { from: 1075, to: [1207, 193], peak: 70,  name: "מטפסים על הארגז" },
    ], signs: [[290, 103, 508, 152], [543, 103, 750, 152], [790, 103, 1002, 152], [1055, 103, 1270, 152]] },
  ];
  const TREASURE = { x: 1342, y: 212 };
  // a different light for each forest
  const MOODS = ["none", "sepia(0.35) saturate(1.3) hue-rotate(-12deg)", "brightness(0.75) saturate(0.9) hue-rotate(15deg)"];

  const state = {
    level: "easy", screen: 1, stars: 0, totalStars: 0,
    floor: 0, idx: 0, tasks: [], busy: false,
    input: "", tries: 0, name: "גוני", sound: true,
    look: {},
  };
  try {
    const saved = JSON.parse(localStorage.getItem("goni-forest") || "{}");
    if (saved.level) state.level = saved.level;
    if (saved.name) state.name = saved.name;
    if (typeof saved.totalStars === "number") state.totalStars = saved.totalStars;
    if (saved.look && typeof saved.look === "object") state.look = saved.look;
  } catch (e) {}
  function save() {
    try { localStorage.setItem("goni-forest", JSON.stringify({ level: state.level, name: state.name, totalStars: state.totalStars, look: state.look })); } catch (e) {}
  }

  // ---------- exercises ----------
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function makeTask(level) {
    if (level === "mix") level = ["easy", "medium", "times", "div"][rnd(0, 3)];
    if (level === "easy") {
      if (Math.random() < 0.5) { const a = rnd(1, 15), b = rnd(1, 20 - a); return { q: `${a} + ${b}`, a: a + b }; }
      const a = rnd(5, 20), b = rnd(1, a); return { q: `${a} − ${b}`, a: a - b };
    }
    if (level === "medium") {
      if (Math.random() < 0.5) { const a = rnd(10, 80), b = rnd(5, 100 - a); return { q: `${a} + ${b}`, a: a + b }; }
      const a = rnd(20, 100), b = rnd(5, a); return { q: `${a} − ${b}`, a: a - b };
    }
    if (level === "times") { const a = rnd(2, 10), b = rnd(2, 10); return { q: `${a} × ${b}`, a: a * b }; }
    const b = rnd(2, 10), c = rnd(2, 10); return { q: `${b * c} ÷ ${b}`, a: c };
  }
  function makeTasks() {
    const out = [], seen = new Set();
    while (out.length < 12) {
      const t = makeTask(state.level);
      if (seen.has(t.q)) continue;
      seen.add(t.q); out.push(t);
    }
    return out;
  }

  // ---------- drawing ----------
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  // ---------- the hero and her look ----------
  // Colors are picked per body part of the girl from the picture; null keeps the picture's own color.
  const PARTS = [
    { key: "hair",   cls: 2, label: "שיער",    orig: "#5a3420", colors: ["#1f1a17", "#e8c06a", "#c0542a", "#ff7ab8", "#4a7be0", "#8a5cd1", "#eeeeee"] },
    { key: "skin",   cls: 1, label: "עור",     orig: "#e8a985", colors: ["#f8dcc4", "#d9a07a", "#a8714c", "#6e4630"] },
    { key: "shirt",  cls: 3, label: "חולצה",   orig: "#9a6fd0", colors: ["#e04a4a", "#f39c33", "#f2d13c", "#4caf50", "#3d8fd1", "#ff7ab8", "#f4f4f4", "#2b2b2b"] },
    { key: "shorts", cls: 4, label: "מכנסיים", orig: "#46689a", colors: ["#2b2b2b", "#e04a4a", "#4caf50", "#f2d13c", "#ff7ab8", "#8a5cd1", "#f4f4f4"] },
    { key: "boots",  cls: 5, label: "נעליים",  orig: "#7a5434", colors: ["#e04a4a", "#2b2b2b", "#f4f4f4", "#ff7ab8", "#3d8fd1", "#f2d13c"] },
  ];
  const HEAD_ITEMS = [["none", "בלי"], ["crown", "👑"], ["hat", "👒"], ["bow", "🎀"], ["flower", "🌸"], ["bunny", "🐰"]];
  const EXTRAS = [["glasses", "👓 משקפיים"], ["cape", "🦸 גלימה"]];

  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function hsl2rgb(h, s, l) {
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }
  const hex2hsl = (hex) => rgb2hsl(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16));

  const sprite = { data: null, w: 0, h: 0, cls: null, hsl: null, mean: {}, cache: {} };
  function loadSprite() {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0);
          const d = ctx.getImageData(0, 0, c.width, c.height);
          sprite.data = d; sprite.w = c.width; sprite.h = c.height;
          classifySprite();
        } catch (e) { sprite.data = null; }
        res();
      };
      img.onerror = () => res();
      img.src = "assets/goni.png";
    });
  }

  function classifySprite() {

    sprite.cls = new Uint8Array(w * h); sprite.hsl = new Float32Array(w * h * 3);
    const sum = {};
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (px[i * 4 + 3] <= 40) continue;
      const [H, S, L] = rgb2hsl(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]);
      sprite.hsl.set([H, S, L], i * 3);
      const yy = y / h, warm = H < 45 || H > 340, face = x >= 38 && y >= 18 && y <= 34;
      let c = 0;
      if (H > 250 && H < 335 && S > 0.15) c = 3;
      else if (!warm && yy > 0.6 && yy < 0.8) c = 4;
      else if (warm && L < 0.5 && yy > 0.82) c = 5;
      else if ((warm && L < 0.42 || L < 0.3) && y < 38 && !face) c = 2;
      else if (warm && L >= 0.42) c = 1;
      sprite.cls[i] = c;
      if (c) { const m = sum[c] || (sum[c] = { l: 0, n: 0 }); m.l += L; m.n++; }

  function spriteURL(look) {

    if (sprite.cache[key]) return sprite.cache[key];
    const { w, h } = sprite, out = new ImageData(new Uint8ClampedArray(sprite.data.data), w, h), px = out.data;

    used.forEach((p) => { target[p.cls] = hex2hsl(look[p.key]); });
    for (let i = 0; i < w * h; i++) {
      const t = target[sprite.cls[i]];
      if (!t) continue;
      const l = sprite.hsl[i * 3 + 2] - sprite.mean[sprite.cls[i]] + t[2];
      const [r, g, b] = hsl2rgb(t[0], t[1], Math.max(0, Math.min(1, l)));

  // ---------- animation ----------
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  }
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    HEAD_ITEMS.forEach(([v, t]) => {
      const b = document.createElement("button");
      b.className = "chipbtn" + (v === "none" ? " txt" : "");
      b.textContent = t; b.dataset.head = v;
      b.addEventListener("click", () => { draft.head = v; updateDesigner(); });
      head.appendChild(b);
    });
    const extra = row("תוספות");
    EXTRAS.forEach(([k, t]) => {
      const b = document.createElement("button");
      b.className = "chipbtn txt"; b.textContent = t; b.dataset.extra = k;
      b.addEventListener("click", () => { draft[k] = !draft[k]; updateDesigner(); });
      extra.appendChild(b);
    });
  }
  function updateDesigner() {
    document.querySelectorAll("#designOpts .swatch").forEach((b) => pressed(b, (draft[b.dataset.part] || "") === b.dataset.value));
    document.querySelectorAll("#designOpts [data-head]").forEach((b) => pressed(b, (draft.head || "none") === b.dataset.head));
    document.querySelectorAll("#designOpts [data-extra]").forEach((b) => pressed(b, !!draft[b.dataset.extra]));
    drawPreview($("bigHero"), draft, null);
  }
  function openDesigner() {
    draft = { ...state.look };
    $("heroName").value = state.name;
    $("startOverlay").hidden = true;
    $("designOverlay").hidden = false;
    updateDesigner();
  }
  $("designBtn").addEventListener("click", openDesigner);
  $("randomBtn").addEventListener("click", () => {
    const pick = (arr) => arr[rnd(0, arr.length - 1)];
    draft = {};
    PARTS.forEach((p) => { draft[p.key] = pick([null, ...p.colors]); });
    draft.head = pick(HEAD_ITEMS)[0];
    draft.glasses = Math.random() < 0.3;
    draft.cape = Math.random() < 0.3;
    updateDesigner();
  });
  $("designDone").addEventListener("click", () => {
    state.look = { ...draft };
    state.name = $("heroName").value.trim() || "גוני";
    save();
    refreshHero();
    $("designOverlay").hidden = true;
    $("startOverlay").hidden = false;
  });

  buildPad();
  buildDesigner();
  newScreen(); // a ready forest behind the start menu
  refreshHero();
  loadSprite().then(refreshHero);
})();
</script>
</body>
</html>
