<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>היער של גוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: the forest picture fills the top, a parchment answer board on wooden planks sits below it (beside it on short landscape phones). One look, no dark theme. */
:root {
  --plank: #6b4423;
  --plank-dark: #4a2c15;
  --parchment: #f1e0bd;
  --parchment-edge: #c9a874;
  --key: #e3b06f;
  --key-dark: #8a5a2e;
  --ink: #3a2412;
  --leaf: #2f7a43;
  --good: #2e9b4f;
  --bad: #c0392b;
  --sun: #ffd447;
  --font: "Rubik", "Arial Hebrew", "Arial", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #20301b;
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sceneWrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#menuFab {
  position: absolute; top: 8px; left: 8px;
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid #2a170a; background: #5a3a20; color: #f6ead2;
  font-size: 22px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
}
#scene { width: 100%; height: 100%; display: block; }

/* wooden planks under the parchment, like the picture */
#panel {
  background:
    repeating-linear-gradient(180deg, transparent 0 46px, rgba(0,0,0,0.35) 46px 49px),
    linear-gradient(90deg, #5c3a1d, #7a4e2a 30%, #6b4423 60%, #5a381b);
  padding: 12px 16px;
  display: flex;
  justify-content: center;
  border-top: 4px solid var(--plank-dark);
}
.board {
  position: relative;
  width: 100%;
  max-width: 820px;
  background: radial-gradient(ellipse at center, #f6e8c8 0%, var(--parchment) 55%, #dcc08c 100%);
  border: 3px solid var(--parchment-edge);
  border-radius: 10px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 0 30px rgba(140,100,50,0.25);
  padding: 10px 16px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.board::before, .board::after {
  content: "";
  position: absolute;
  top: 8px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #9a9a9a, #4b4b4b);
}
.board::before { left: 8px; }
.board::after { right: 8px; }
#obstacleName { font-size: 18px; font-weight: 500; color: var(--ink); min-height: 1.2em; text-align: center; }
#task {
  display: flex;
  align-items: center;
  gap: 14px;
  font-weight: 800;
  font-size: clamp(32px, 6vw, 46px);
  direction: ltr;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
#answer {
  min-width: 2.8em;
  height: 1.35em;
  border: 3px solid var(--leaf);
  border-radius: 10px;
  background: rgba(255,255,255,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--leaf);
}
#answer.blink:empty::after { content: "|"; font-weight: 500; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#msg { min-height: 1.3em; font-size: 18px; font-weight: 700; text-align: center; }
#msg.good { color: var(--good); }
#msg.bad { color: var(--bad); }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

#pad {
  display: grid;
  grid-template-columns: repeat(6, minmax(44px, 74px));
  gap: 10px;
  direction: ltr;
}
#pad button {
  font-family: var(--font);
  font-weight: 800;
  font-size: 26px;
  height: 52px;
  border: 2px solid var(--key-dark);
  border-radius: 12px;
  background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52);
  color: var(--ink);
  box-shadow: 0 4px 0 #5e3b1b, inset 0 2px 0 rgba(255,255,255,0.45);
  cursor: pointer;
  touch-action: manipulation;
}
#pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e3b1b; }
#pad button:focus-visible, .bigbtn:focus-visible, .levels button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#pad .ok { background: linear-gradient(180deg, #4fbf63, #2e9b4f 55%, #23803a); color: #fff; border-color: #1a5e2a; box-shadow: 0 4px 0 #154a22, inset 0 2px 0 rgba(255,255,255,0.35); }
#pad .del { background: linear-gradient(180deg, #faf1e2, #eadbc2); }

@media (orientation: landscape) and (max-height: 560px) {
  #app { flex-direction: row; }
  #panel { border-top: 0; border-left: 4px solid var(--plank-dark); width: 290px; align-items: center; padding: 8px; }
  .board { padding: 8px 10px; gap: 6px; }
  #pad { grid-template-columns: repeat(4, 54px); gap: 6px; }
  #pad button { height: 42px; font-size: 21px; }
  #task { font-size: 30px; }
}
@media (max-width: 480px) {
  #pad { grid-template-columns: repeat(4, 1fr); width: 100%; }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 30, 14, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
.overlay .board { max-width: 460px; padding: 26px 22px; gap: 14px; text-align: center; max-height: 100%; overflow-y: auto; }
.overlay h2 { font-size: 34px; font-weight: 800; margin: 0; color: var(--plank-dark); text-wrap: balance; }
.overlay p { margin: 0; font-size: 17px; line-height: 1.5; }
.credit { color: #b03a5b; font-size: 15px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.levels button, .bigbtn {
  font-family: var(--font);
  font-size: 16px;
  border: 2px solid var(--key-dark);
  border-radius: 12px;
  padding: 10px 8px;
  cursor: pointer;
  background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52);
  color: var(--ink);
  box-shadow: 0 4px 0 #5e3b1b;
  line-height: 1.3;
}
.levels button b { display: block; font-size: 22px; font-weight: 800; }
.levels button[aria-pressed="true"] { background: linear-gradient(180deg, #ffe58a, var(--sun)); border-color: #a57b00; }
.bigbtn { width: 100%; font-size: 24px; font-weight: 800; background: linear-gradient(180deg, #4fbf63, #2e9b4f 55%, #23803a); color: #fff; border-color: #1a5e2a; box-shadow: 0 4px 0 #154a22; }
.bigbtn.plain { background: linear-gradient(180deg, #f0c68c, var(--key) 55%, #c98f52); color: var(--ink); border-color: var(--key-dark); box-shadow: 0 4px 0 #5e3b1b; font-size: 18px; }
.stars { font-size: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; direction: ltr; }
label.namefield { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 17px; flex-wrap: wrap; }
label.namefield input {
  font: inherit; font-size: 18px; border: 2px solid var(--parchment-edge); border-radius: 10px; padding: 6px 10px; width: 9em; background: #fffaf0; color: var(--ink);
}
[hidden] { display: none !important; }

.hit { cursor: pointer; }
.hit:focus-visible { outline: none; }
.hit:focus-visible circle { stroke: var(--sun); stroke-width: 4; }
.signGlow { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: 0.45; } }
.confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .signGlow { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="sceneWrap">
    <svg id="scene" viewBox="0 0 1536 700" preserveAspectRatio="xMidYMid meet" aria-label="היער של גוני"></svg>
    <button id="menuFab" aria-label="תפריט" hidden>☰</button>
  </div>
  <div id="panel">
    <div class="board">
      <div id="obstacleName"></div>
      <div id="task"><span id="question"></span><span>=</span><span id="answer" class="blink"></span></div>
      <div id="msg"></div>
      <div id="pad"></div>
    </div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="board">
    <h2>המסע ביער</h2>
    <p>פותרים תרגיל, והדמות עוברת מכשול!<br>4 מכשולים בכל קומה, מטפסים בסולם, ובסוף מחכה אוצר.</p>
    <p class="credit">משחק שהמציאה גוני 💚</p>
    <label class="namefield" for="heroName">איך קוראים לדמות?
      <input id="heroName" maxlength="12" value="גוני">
    </label>
    <div class="levels" id="levels">
      <button data-level="easy" aria-pressed="true"><b>קל</b>חיבור וחיסור עד 20</button>
      <button data-level="medium" aria-pressed="false"><b>בינוני</b>חיבור וחיסור עד 100</button>
      <button data-level="times" aria-pressed="false"><b>כפל</b>לוח הכפל</button>
      <button data-level="mix" aria-pressed="false"><b>אלוף</b>הכול ביחד, גם חילוק</button>
    </div>
    <button class="bigbtn" id="startBtn">יוצאים לדרך!</button>
  </div>
</div>

<div class="overlay" id="winOverlay" hidden>
  <div class="board">
    <h2>האוצר נמצא! 🎉</h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <button class="bigbtn" id="nextBtn">ליער הבא</button>
    <button class="bigbtn plain" id="toMenuBtn">שינוי רמה</button>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("scene");
  const LADDER_X = 1357;
  const HERO_W = 72, HERO_H = 105;

  // Everything below is measured on the forest picture (1536 × 700).
  // Floors from bottom to top: the feet line, where the hero starts, the 4 obstacles
  // (jump from → to, how high), and the sign that hangs above each one.
  const FLOORS = [
    { y: 652, start: 250, steps: [
      { from: 300,  to: [605, 652],  peak: 70,  name: "מדלגים מעל שלולית בוץ" },
      { from: 605,  to: [852, 652],  peak: 150, name: "קופצים מעל שיח פירות יער" },
      { from: 852,  to: [1100, 652], peak: 125, name: "קפיצה מעל ערימת בולי עץ" },
      { from: 1100, to: [1335, 652], peak: 115, name: "קופצים מעל פטרייה ענקית" },
    ], signs: [[245, 462, 475, 512], [545, 462, 745, 512], [828, 463, 1030, 512], [1088, 463, 1300, 512]] },
    { y: 425, start: 245, steps: [
      { from: 285, to: [532, 425],  peak: 100, name: "קופצים מעל גזע חלול" },
      { from: 532, to: [737, 425],  peak: 85,  name: "קופצים מעל מלכודת קוצים" },
      { from: 737, to: [952, 425],  peak: 115, name: "קפיצה מעל בולי עץ גבוהים" },
      { from: 952, to: [1205, 425], peak: 85,  name: "עוד מלכודת קוצים!" },
    ], signs: [[285, 284, 490, 332], [535, 284, 745, 332], [815, 284, 1020, 332], [1076, 284, 1278, 332]] },
    { y: 243, start: 250, steps: [
      { from: 300,  to: [615, 243],  peak: 120, name: "קופצים מעל שיח פירות יער" },
      { from: 615,  to: [717, 204],  peak: 75,  name: "קופצים על הפטרייה" },
      { from: 717,  to: [1075, 243], peak: 60,  name: "קופצים מעל בול עץ" },
      { from: 1075, to: [1207, 193], peak: 70,  name: "מטפסים על הארגז" },
    ], signs: [[290, 103, 508, 152], [543, 103, 750, 152], [790, 103, 1002, 152], [1055, 103, 1270, 152]] },
  ];
  const TREASURE = { x: 1342, y: 212 };
  // a different light for each forest
  const MOODS = ["none", "sepia(0.35) saturate(1.3) hue-rotate(-12deg)", "brightness(0.75) saturate(0.9) hue-rotate(15deg)"];

  const state = {
    level: "easy", screen: 1, stars: 0, totalStars: 0,
    floor: 0, idx: 0, tasks: [], busy: false,
    input: "", tries: 0, name: "גוני", sound: true,
  };
  try {
    const saved = JSON.parse(localStorage.getItem("goni-forest") || "{}");
    if (saved.level) state.level = saved.level;
    if (saved.name) state.name = saved.name;
    if (typeof saved.totalStars === "number") state.totalStars = saved.totalStars;
  } catch (e) {}
  function save() {
    try { localStorage.setItem("goni-forest", JSON.stringify({ level: state.level, name: state.name, totalStars: state.totalStars })); } catch (e) {}
  }

  // ---------- exercises ----------
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function makeTask(level) {
    if (level === "mix") level = ["easy", "medium", "times", "div"][rnd(0, 3)];
    if (level === "easy") {
      if (Math.random() < 0.5) { const a = rnd(1, 15), b = rnd(1, 20 - a); return { q: `${a} + ${b}`, a: a + b }; }
      const a = rnd(5, 20), b = rnd(1, a); return { q: `${a} − ${b}`, a: a - b };
    }
    if (level === "medium") {
      if (Math.random() < 0.5) { const a = rnd(10, 80), b = rnd(5, 100 - a); return { q: `${a} + ${b}`, a: a + b }; }
      const a = rnd(20, 100), b = rnd(5, a); return { q: `${a} − ${b}`, a: a - b };
    }
    if (level === "times") { const a = rnd(2, 10), b = rnd(2, 10); return { q: `${a} × ${b}`, a: a * b }; }
    const b = rnd(2, 10), c = rnd(2, 10); return { q: `${b * c} ÷ ${b}`, a: c };
  }
  function makeTasks() {
    const out = [], seen = new Set();
    while (out.length < 12) {
      const t = makeTask(state.level);
      if (seen.has(t.q)) continue;
      seen.add(t.q); out.push(t);
    }
    return out;
  }

  // ---------- drawing ----------
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  let bgImage, hero, heroTag, vine, signs = [], hud = {}, treasureGlow;
  const heroPos = { x: 0, y: 0 };

  function buildScene() {
    svg.innerHTML = "";
    const defs = el("defs", {}, svg);
    const f = el("filter", { id: "blur", x: "-20%", y: "-50%", width: "140%", height: "200%" }, defs);
    el("feGaussianBlur", { stdDeviation: 5 }, f);
    const rg = el("radialGradient", { id: "shine" }, defs);
    el("stop", { offset: 0, "stop-color": "#fff6b0", "stop-opacity": 1 }, rg);
    el("stop", { offset: 1, "stop-color": "#ffd447", "stop-opacity": 0 }, rg);

    bgImage = el("image", { href: "assets/forest.webp", x: 0, y: 0, width: 1536, height: 700 }, svg);

    // HUD numbers on the wooden bar
    const hudText = { "font-family": "Rubik, Arial, sans-serif", "font-weight": 700, fill: "#f6ead2", "text-anchor": "middle" };
    hud.screen = el("text", { ...hudText, x: 1099, y: 54, "font-size": 28 }, svg);
    hud.stars = el("text", { ...hudText, x: 1278, y: 54, "font-size": 28 }, svg);
    hud.mute = el("path", { d: "M1350 20 L1400 66", stroke: "#e0533c", "stroke-width": 6, "stroke-linecap": "round", visibility: "hidden" }, svg);
    hud.soundHit = el("g", { class: "hit", tabindex: 0, role: "button", "aria-label": "צליל" }, svg);
    el("circle", { cx: 1375, cy: 43, r: 34, fill: "transparent" }, hud.soundHit);
    hud.menuHit = el("g", { class: "hit", tabindex: 0, role: "button", "aria-label": "תפריט" }, svg);
    el("circle", { cx: 1468, cy: 43, r: 34, fill: "transparent" }, hud.menuHit);

    // treasure shine (shown at the end) behind the hero
    treasureGlow = el("circle", { cx: TREASURE.x, cy: TREASURE.y, r: 0, fill: "url(#shine)" }, svg);

    // signs
    signs = [];
    FLOORS.forEach((fl, fi) => fl.signs.forEach(([a, b, c, d], i) => {
      const g = el("g", {}, svg);
      const glow = el("rect", { class: "signGlow", x: a - 4, y: b - 4, width: c - a + 8, height: d - b + 8, rx: 10, fill: "none", stroke: "#ffe066", "stroke-width": 8, filter: "url(#blur)", visibility: "hidden" }, g);
      const ring = el("rect", { x: a, y: b, width: c - a, height: d - b, rx: 7, fill: "none", stroke: "#ffe066", "stroke-width": 4, visibility: "hidden" }, g);
      const tint = el("rect", { x: a + 3, y: b + 3, width: c - a - 6, height: d - b - 6, rx: 6, fill: "#7fd18b", opacity: 0, }, g);
      const text = el("text", { x: (a + c) / 2, y: (b + d) / 2 + 11, "text-anchor": "middle", "font-family": "Rubik, Arial, sans-serif", "font-weight": 700, "font-size": 31, fill: "#3a2412", direction: "ltr" }, g);
      const t = state.tasks[fi * 4 + i];
      text.textContent = `${t.q} = ?`;
      signs.push({ glow, ring, tint, text });
    }));

    vine = el("path", { stroke: "#5a7a2a", "stroke-width": 6, "stroke-linecap": "round", fill: "none", visibility: "hidden" }, svg);

    // hero: the girl from the picture plus her name tag
    hero = el("g", {}, svg);
    const body = el("g", { id: "heroBody" }, hero);
    el("image", { href: "assets/goni.png", x: -HERO_W / 2, y: -HERO_H, width: HERO_W, height: HERO_H }, body);
    const tag = el("g", {}, hero);
    heroTag = el("text", { x: 0, y: -HERO_H - 12, "text-anchor": "middle", "font-family": "Rubik, Arial, sans-serif", "font-weight": 700, "font-size": 17, fill: "#fff" }, tag);
    heroTag.textContent = state.name;
    const w = Math.max(54, state.name.length * 11 + 22);
    tag.insertBefore(el("rect", { x: -w / 2, y: -HERO_H - 32, width: w, height: 27, rx: 10, fill: "#2b2a26", opacity: 0.85 }), heroTag);
    hero.body = body;

    applyMood();
    placeHero(FLOORS[0].start, FLOORS[0].y);
  }
  function applyMood() { bgImage.style.filter = MOODS[(state.screen - 1) % MOODS.length]; }

  function placeHero(x, y, rot = 0, flip = false) {
    heroPos.x = x; heroPos.y = y;
    hero.setAttribute("transform", `translate(${x} ${y})`);
    hero.body.setAttribute("transform", `rotate(${rot} 0 -10)${flip ? " scale(-1 1)" : ""}`);
    updateCamera();
  }
  // On tall narrow screens (phones held upright) show part of the forest up close and follow the hero.
  function updateCamera() {
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const vbW = Math.min(1536, Math.max(620, 700 * r.width / r.height));
    const panning = vbW < 1536;
    const x = panning ? Math.max(0, Math.min(1536 - vbW, heroPos.x - vbW / 2)) : 0;
    svg.setAttribute("viewBox", `${x} 0 ${vbW} 700`);
    $("menuFab").hidden = !panning;
  }
  addEventListener("resize", updateCamera);

  // ---------- animation ----------
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tween(ms, fn) {
    if (reduced) ms = Math.min(ms, 150);
    return new Promise((res) => {
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / ms);
        fn(t);
        t < 1 ? requestAnimationFrame(step) : res();
      }
      requestAnimationFrame(step);
    });
  }
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  async function walkTo(x) {
    const x0 = heroPos.x, y = heroPos.y, d = Math.abs(x - x0);
    if (d < 1) return;
    const flip = x < x0;
    await tween(d * 4.5, (t) => {
      const ph = t * d / 18;
      placeHero(x0 + (x - x0) * t, y - Math.abs(Math.sin(ph)) * 5, Math.sin(ph) * 4, flip);
    });
    placeHero(x, y);
  }
  async function jumpTo(x, y, peak) {
    const x0 = heroPos.x, y0 = heroPos.y;
    sfx.jump();
    await tween(700, (t) => placeHero(x0 + (x - x0) * t, y0 + (y - y0) * t - Math.sin(Math.PI * t) * peak, Math.sin(Math.PI * 2 * t) * 10));
    placeHero(x, y);
  }
  async function climbTo(y) {
    const y0 = heroPos.y, x = heroPos.x;
    await tween(1600, (t) => placeHero(x, y0 + (y - y0) * t, Math.sin(t * 24) * 4));
    placeHero(x, y);
  }
  async function swingTo(x, y, anchorY) {
    // grab a vine and swing back to the left end of the new floor
    const x0 = heroPos.x, y0 = heroPos.y, ax = (x0 + x) / 2;
    vine.setAttribute("visibility", "visible");
    sfx.whee();
    await tween(1600, (tt) => {
      const t = ease(tt);
      const hx = x0 + (x - x0) * t, hy = y0 + (y - y0) * t - Math.sin(Math.PI * t) * 45;
      placeHero(hx, hy, Math.sin(Math.PI * t) * 12, true);
      vine.setAttribute("d", `M${ax} ${anchorY} Q${(ax + hx) / 2} ${(anchorY + hy) / 2 + 30} ${hx} ${hy - HERO_H + 25}`);
    });
    vine.setAttribute("visibility", "hidden");
    placeHero(x, y);
  }

  // ---------- sound ----------
  let actx;
  function tone(freq, dur, type = "sine", delay = 0, vol = 0.15) {
    if (!state.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    good: () => { tone(523, 0.15); tone(659, 0.15, "sine", 0.1); tone(784, 0.25, "sine", 0.2); },
    bad: () => tone(200, 0.25, "square", 0, 0.06),
    jump: () => { tone(400, 0.12, "triangle"); tone(600, 0.1, "triangle", 0.08); },
    whee: () => [500, 600, 700, 800, 900].forEach((f, i) => tone(f, 0.12, "triangle", i * 0.08, 0.08)),
    win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.2, "sine", i * 0.14)),
    tap: () => tone(800, 0.04, "sine", 0, 0.05),
  };

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const answerEl = $("answer"), msgEl = $("msg"), questionEl = $("question");

  function buildPad() {
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "⌫", "✓"].forEach((k) => {
      const b = document.createElement("button");
      b.textContent = k;
      if (k === "✓") { b.className = "ok"; b.setAttribute("aria-label", "בדיקה"); }
      if (k === "⌫") { b.className = "del"; b.setAttribute("aria-label", "מחיקה"); }
      b.addEventListener("click", () => press(k));
      $("pad").appendChild(b);
    });
  }
  function press(k) {
    if (state.busy) return;
    if (k === "⌫") state.input = state.input.slice(0, -1);
    else if (k === "✓") return check();
    else if (state.input.length < 3) state.input += k;
    sfx.tap();
    answerEl.textContent = state.input;
  }
  document.addEventListener("keydown", (e) => {
    if (!$("startOverlay").hidden || !$("winOverlay").hidden) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter") { e.preventDefault(); press("✓"); }
  });

  const current = () => state.floor * 4 + state.idx;
  function showTask() {
    const n = current(), t = state.tasks[n];
    questionEl.textContent = t.q;
    $("obstacleName").textContent = FLOORS[state.floor].steps[state.idx].name;
    state.input = ""; state.tries = 0;
    answerEl.textContent = "";
    answerEl.classList.add("blink");
    signs.forEach((s, i) => {
      s.glow.setAttribute("visibility", i === n ? "visible" : "hidden");
      s.ring.setAttribute("visibility", i === n ? "visible" : "hidden");
    });
  }
  const setMsg = (text, cls) => { msgEl.textContent = text; msgEl.className = cls || ""; };
  const PRAISE = ["כל הכבוד!", "מעולה!", "יש!", "אלופה!", "וואו!", "נכון!", "מדהים!"];

  async function check() {
    if (state.input === "") return;
    const n = current(), t = state.tasks[n];
    if (Number(state.input) === t.a) {
      state.busy = true;
      answerEl.classList.remove("blink");
      sfx.good();
      const firstTry = state.tries === 0;
      if (firstTry) state.stars++;
      setMsg(PRAISE[rnd(0, PRAISE.length - 1)] + (firstTry ? " ⭐" : ""), "good");
      const s = signs[n];
      s.text.textContent = `${t.q} = ${t.a}`;
      s.tint.setAttribute("opacity", 0.45);
      s.glow.setAttribute("visibility", "hidden");
      s.ring.setAttribute("visibility", "hidden");
      updateHud();
      await advance();
      state.busy = false;
    } else {
      state.tries++;
      sfx.bad();
      const task = $("task");
      task.classList.remove("shake"); void task.offsetWidth; task.classList.add("shake");
      shakeHead();
      if (state.tries >= 3) setMsg(`רמז: התשובה היא ${t.a}`, "bad");
      else setMsg(state.tries === 1 ? "כמעט! נסו שוב" : "עוד ניסיון אחד, לאט לאט", "bad");
      state.input = "";
      answerEl.textContent = "";
    }
  }
  function shakeHead() {
    const { x, y } = heroPos;
    tween(450, (t) => placeHero(x, y, Math.sin(t * Math.PI * 4) * 8)).then(() => placeHero(x, y));
  }

  async function advance() {
    const fl = FLOORS[state.floor], step = fl.steps[state.idx];
    await jumpTo(step.to[0], step.to[1], step.peak);
    if (state.idx < 3) {
      state.idx++;
      await walkTo(fl.steps[state.idx].from);
    } else if (state.floor < 2) {
      const next = FLOORS[state.floor + 1];
      await walkTo(LADDER_X);
      await climbTo(next.y);
      const anchorY = state.floor === 0 ? FLOORS[2].y + 20 : 70;
      await swingTo(next.start, next.y, anchorY);
      state.floor++; state.idx = 0;
      await walkTo(next.steps[0].from);
    } else {
      return win();
    }
    setMsg("");
    showTask();
  }

  function updateHud() {
    hud.screen.textContent = `מסך ${state.screen}`;
    hud.stars.textContent = state.stars;
  }

  async function win() {
    sfx.win();
    await tween(900, (t) => treasureGlow.setAttribute("r", 90 * ease(t)));
    confetti();
    state.totalStars += state.stars;
    save();
    await tween(700, () => {});
    $("winStars").innerHTML = "<span>⭐</span>".repeat(state.stars);
    $("winText").textContent = `${state.stars} מתוך 12 תרגילים נפתרו בניסיון הראשון. בסך הכול נאספו ${state.totalStars} כוכבים.`;
    $("winOverlay").hidden = false;
  }
  function confetti() {
    const colors = ["#ffd447", "#d9446b", "#8a5cd1", "#3d8fd1", "#5aa65a"];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2 + Math.random() * 2 + "s";
      c.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function toggleSound() {
    state.sound = !state.sound;
    hud.mute.setAttribute("visibility", state.sound ? "hidden" : "visible");
  }
  function openMenu() { $("startOverlay").hidden = false; }

  function newScreen() {
    state.tasks = makeTasks();
    state.floor = 0; state.idx = 0; state.stars = 0; state.busy = false;
    buildScene();
    hud.mute.setAttribute("visibility", state.sound ? "hidden" : "visible");
    hud.soundHit.addEventListener("click", toggleSound);
    hud.menuHit.addEventListener("click", openMenu);
    [hud.soundHit, hud.menuHit].forEach((h) => h.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.dispatchEvent(new Event("click")); } }));
    updateHud();
    setMsg("");
    showTask();
  }
  async function begin() {
    newScreen();
    state.busy = true;
    await walkTo(FLOORS[0].steps[0].from);
    state.busy = false;
  }

  document.querySelectorAll("#levels button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.level === state.level));
    b.addEventListener("click", () => {
      state.level = b.dataset.level;
      document.querySelectorAll("#levels button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    });
  });
  $("heroName").value = state.name;
  $("startBtn").addEventListener("click", () => {
    state.name = $("heroName").value.trim() || "גוני";
    state.screen = 1;
    save();
    $("startOverlay").hidden = true;
    begin();
  });
  $("nextBtn").addEventListener("click", () => { state.screen++; $("winOverlay").hidden = true; begin(); });
  $("menuFab").addEventListener("click", openMenu);
  $("toMenuBtn").addEventListener("click", () => { $("winOverlay").hidden = true; openMenu(); });

  buildPad();
  newScreen(); // a ready forest behind the start menu
})();
</script>
</body>
</html>
